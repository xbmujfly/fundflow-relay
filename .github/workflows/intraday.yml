name: relay-intraday

# 盘中「当日主力净额 + 日内累计曲线」中转（2026-09-27 建）
# 背景：本机(校园网出口)被东财 push2 整族拒连 → 盘中真资金口径只能走 runner。
# 只抓「监控名单」relay/intraday_watch.json（持仓+观察池+分层池 T1-T4），几十个请求/次 → 可每 10 分钟跑。
# 产出 relay/data/intraday_<date>.json（半场比分；本机 common/intraday_relay.py 取回，
# 由 intraday_weak_watch.py 判「B4/B5 资金转弱」）。
#
# ⚠️ 盘中数据是**进行时**（半场比分），绝不入库 fundflow_history.db，只做当日预警。

on:
  workflow_dispatch:
  schedule:
    # ⚠️ 只在**有交易**的时段抓（2026-09-27 用户两次纠正）：
    #   · "9:30 开盘后抓吧，9 点还没开盘呢" → 不排 9:00
    #   · "11:30 到 13:00 也不用抓"          → 午间休市不抓（累计曲线跨午休连续，不丢数据）
    # 北京 09:35-09:55（开盘段 3 趟）｜10:00-10:50｜11:00-11:20｜13:00-15:50
    - cron: '35,45,55 1 * * 1-5'            # UTC 01:35/45/55 = 北京 09:35/45/55
    - cron: '0,10,20,30,40,50 2 * * 1-5'    # UTC 02:00-02:50 = 北京 10:00-10:50
    - cron: '0,10,20 3 * * 1-5'             # UTC 03:00-03:20 = 北京 11:00-11:20
    - cron: '*/10 5-7 * * 1-5'              # UTC 05:00-07:50 = 北京 13:00-15:50

permissions:
  contents: write

concurrency:
  group: relay-intraday
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: 抓盘中资金（监控名单）
        run: python3 relay/gha/fetch_intraday.py --watch relay/intraday_watch.json --out relay/data

      - name: 清理 3 天前的盘中分片（防仓库膨胀）
        if: always()
        run: |
          ls relay/data/intraday_*.json 2>/dev/null | head -n -6 | xargs -r rm -f || true

      - name: 提交
        if: always()
        run: |
          git config user.name  "fundflow-relay-bot"
          git config user.email "relay@users.noreply.github.com"
          git add -A relay/data
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
          else
            git pull --rebase --autostash || true
            git commit -m "relay: intraday $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
